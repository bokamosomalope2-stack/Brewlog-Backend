

name: CI/CD PIPELINE

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    needs:
      -
    steps:
      # Step 1: Download the source code from gihub
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Stage 2: Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Stage 3: Build the application with Maven
      - name: Build with Maven
        run: mvn clean package

      # Stage 4: Login to Docker Hub
      - name: Login to Docker Hub
        if:
          github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags:
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-management:${{github.sha}}