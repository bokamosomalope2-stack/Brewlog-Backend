version: "3.9"

services:
  brewlog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brewlog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - brewlog_db_data:/var/lib/postgresql/data
    networks:
      - brelog-net

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  brewlog_db_data:


networks:
  brewlog-net:
    driver: bridge